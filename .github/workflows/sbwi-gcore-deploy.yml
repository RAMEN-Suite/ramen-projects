name: deploy sbwi gcore files

on:
  push:
    branches:
      - main
      - dev
      - tori
      - miso
    paths:
      - 'projects/sbwi/**.gcore.json'
      - 'projects/gcore.json'
      - '.github/workflows/sbwi-gcore-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Determine the target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      prefix: ${{ steps.target.outputs.prefix }}
      restart: ${{ steps.target.outputs.restart }}
    env:
      GITHUB_REF: ${{ github.ref }}
    steps:
      - id: target
        run: |
          environment="" prefix="" restart=""
          case "$GITHUB_REF" in
            refs/heads/main) environment=sbwi restart="ed/tori ed/miso" ;;
            refs/heads/dev) environment=staging restart="dev/tori dev/miso" ;;
            refs/heads/shoyu | refs/heads/tori | refs/heads/miso)
              tool="${GITHUB_REF#refs/heads/}"
              environment=development prefix="$tool/"
              case "$tool" in tori) restart=tori/tori ;; miso) restart=miso/miso ;; esac
              ;;
          esac
          {
            echo "environment=$environment"
            echo "prefix=$prefix"
            echo "restart=$restart"
          } >> "$GITHUB_OUTPUT"
  sync:
    needs: setup
    if: needs.setup.outputs.environment != ''
    name: sync with (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install SSH Key
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PRIVATE_KEY: ${{ secrets.SSH_RSYNC_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $HOST
            User $USER
            IdentityFile ~/.ssh/staging.key
          END
      - name: Copy gcore to remote
        working-directory: projects
        env:
          USER: ${{ secrets.SSH_USER }}
          PREFIX: ${{ needs.setup.outputs.prefix }}
        run: rsync -z --mkpath gcore.json "$USER"@staging:"$PREFIX"gcore/
      - name: Copy project files to remote
        working-directory: projects/sbwi
        env:
          USER: ${{ secrets.SSH_USER }}
          PREFIX: ${{ needs.setup.outputs.prefix }}
        run: rsync -z --mkpath ramen.gcore.json project.gcore.json "$USER"@staging:"$PREFIX"gcore/
  restart:
    needs: [setup, sync]
    if: needs.setup.outputs.restart != ''
    name: Restart (${{ needs.setup.outputs.environment }}) - Server
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    permissions: {}
    steps:
      - name: Install SSH Key
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $HOST
            User $USER
            IdentityFile ~/.ssh/staging.key
          END
      - name: Restart the servers that read gcore
        env:
          RESTART: ${{ needs.setup.outputs.restart }}
        run: |
          for stack in $RESTART; do
            ssh -n staging restart "$stack" server
          done
