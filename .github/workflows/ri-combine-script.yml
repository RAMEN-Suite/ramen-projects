name: ri combine scripts

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  combine:
    name: Combine and commit RI import scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # required to commit and push the combined script to dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: true # zizmor: ignore[artipacked] -- required for git push in the next step
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Combine scripts and push changes
        shell: bash
        run: |
          export LC_ALL=C
          scripts=(imports/ri/[0-8][0-9]_*.cyp)
          {
            for script in "${scripts[@]}"; do
              cat "$script"
              printf '\n\n'
            done
          } > imports/ri/99_combined-script.cyp

          git add -- imports/ri/99_combined-script.cyp
          if git diff --cached --quiet; then
            echo "Combined script is already up to date."
            exit 0
          fi

          git commit -m "chore(ri): regenerate combined import script"
          git push origin HEAD:${{ github.ref }}
