name: Content request
description: Suggest new or changed project content.
labels: [enhancement]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: [abbw, sbwi, ri, other]
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
