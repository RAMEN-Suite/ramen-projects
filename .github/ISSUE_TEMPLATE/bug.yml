name: Content problem
description: Report wrong or broken project content (configuration, texts, guidelines, import scripts).
labels: [bug]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: [abbw, sbwi, ri, other]
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [shoyu, tori, miso, import scripts]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did you see it?
      description: Production, staging or development, and the page or file.
      placeholder: 'staging, start page'
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What is wrong?
      description: Describe the actual and the expected content or behavior.
    validations:
      required: true
